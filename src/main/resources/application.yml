server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_food?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root@123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: campus-food-delivery-secret-key-2024-very-long-string
  expiration: 86400000

logging:
  level:
    com.campus.food: DEBUG
    org.springframework.security: DEBUG