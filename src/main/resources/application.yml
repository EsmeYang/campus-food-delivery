server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_food?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_MYSQL_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
jwt:
  secret: YOUR_JWT_SECRET_KEY
  expiration: 86400000
logging:
  level:
    com.campus.food: DEBUG
    org.springframework.security: DEBUG